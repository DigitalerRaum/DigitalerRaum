<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein 3D-Objekt in AR</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p  { margin: 0 0 20px; color: #636366; }
    a.ar img {
      width: min(90vw, 480px);
      height: auto;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }
    .hinweis { margin-top: 20px; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Mein 3D-Objekt</h1>
  <p>Auf iPhone, iPad oder Vision Pro das Bild antippen, um das Objekt in AR zu sehen.</p>

  <!-- rel="ar" aktiviert Apple AR Quick Look (Safari) -->
  <a class="ar" rel="ar" href="objekt.usdz">
    <img src="vorschau.jpg" alt="Vorschau des 3D-Objekts">
  </a>

  <p class="hinweis">Hinweis: Quick Look funktioniert nur in Safari auf Apple-Geräten.</p>
</body>
</html>
